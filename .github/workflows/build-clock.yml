name: Build and QC Aurecon font variant

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/build-clock.yml"
      - "tools/build_clock.py"
      - "tools/qc_browser.py"
      - "tools/position_numbers.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-clock
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and browser dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow numpy fonttools brotli playwright
          python -m playwright install --with-deps chromium

      - name: Build local-font production files
        run: |
          set -o pipefail
          : > BUILD_LOG.txt
          python tools/build_clock.py 2>&1 | tee -a BUILD_LOG.txt
          python tools/position_numbers.py 2>&1 | tee -a BUILD_LOG.txt

      - name: Static checks
        run: |
          set -o pipefail
          {
            python -m py_compile tools/build_clock.py tools/qc_browser.py tools/position_numbers.py
            node --check screen-8f2c6d71/clock.js
            test -s screen-8f2c6d71/fonts/PTSerif-Regular.ttf
            test -s screen-8f2c6d71/fonts/PTSerif-Bold.ttf
            test -s screen-8f2c6d71/fonts/OpenSans-SemiBold.ttf
            test -s screen-8f2c6d71/fonts/OpenSans-Bold.ttf
            test -s screen-8f2c6d71/fonts/OpenSans-ExtraBold.ttf
            test -s screen-8f2c6d71/digit_targets.js
            test -s screen-8f2c6d71/digit_outlines_grey.png
            test -s screen-8f2c6d71/digit_outlines_green.png
            grep -q "font-src 'self'" screen-8f2c6d71/index.html
            grep -q "Disallow: /" robots.txt
            grep -q "y: 201" screen-8f2c6d71/clock.js
            grep -q '"opticallyCentred":true' screen-8f2c6d71/digit_targets.js
          } 2>&1 | tee -a BUILD_LOG.txt

      - name: Browser QC at native and mobile sizes
        run: |
          set -o pipefail
          python -m http.server 8000 >/tmp/clock-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          python tools/qc_browser.py 2>&1 | tee -a BUILD_LOG.txt
          test -s BROWSER_QC_REPORT.json
          test -s QC_NATIVE.png

      - name: Commit generated production build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Centre large Open Sans numerals [generated]"
            git push
          fi

      - name: Record build result
        if: always()
        env:
          BUILD_RESULT: ${{ job.status }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          {
            echo "# Build status"
            echo
            echo "Result: ${BUILD_RESULT}"
            echo "Recorded: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Source workflow commit: ${GITHUB_SHA}"
          } > BUILD_STATUS.md
          git add BUILD_STATUS.md
          if [ -f BUILD_LOG.txt ]; then git add BUILD_LOG.txt; fi
          if git diff --cached --quiet; then
            echo "Build status is unchanged."
          else
            git commit -m "Record clock build result: ${BUILD_RESULT} [skip ci]"
            git push
          fi
